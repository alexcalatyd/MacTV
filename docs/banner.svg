<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glowBlue" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="78%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#ff9f45" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff9f45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
